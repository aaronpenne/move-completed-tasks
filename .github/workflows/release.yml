name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Verify version consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "Version mismatch: tag=$TAG manifest=$MANIFEST package=$PACKAGE"
            exit 1
          fi

      - name: Bundle plugin zip
        run: |
          mkdir move-completed-tasks
          cp main.js manifest.json styles.css move-completed-tasks/
          zip -r move-completed-tasks.zip move-completed-tasks/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            move-completed-tasks.zip
            main.js
            manifest.json
            styles.css
